name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (guardrail failover, no secrets required)
        run: npm test

      - name: Type-check + production build
        run: npm run build

      - name: Verify packaged native encoder without network or credentials
        run: node scripts/check-runtime.mjs
