<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7de3c2"/></marker></defs><rect width="1440" height="1050" fill="#080e14"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="16" fill="#7de3c2" font-weight="600">AEGIS / SYSTEM ARCHITECTURE</text><text x="60" y="122" font-family="Arial, sans-serif" font-size="42" fill="#eef5f8" font-weight="600">Evidence before trust.</text><text x="60" y="159" font-family="Arial, sans-serif" font-size="18" fill="#b4c4cf" font-weight="400">Track 04 · Agent Reliability, Security &amp; Evaluation · SyedMaaz786</text><rect x="45" y="200" width="1350" height="370" rx="18" fill="#0b141c" stroke="#263945" stroke-dasharray="7 5"/><text x="66" y="232" font-family="Arial, sans-serif" font-size="13" fill="#8395a4" font-weight="600">NEXT.JS NODE RUNTIME / REQUEST RELEASE BOUNDARY</text><rect x="65" y="265" width="245" height="160" rx="14" fill="#111d27" stroke="#30414d"/><text x="87" y="299" font-family="Arial, sans-serif" font-size="19" fill="#7de3c2" font-weight="600">01  Input guardrail</text><text x="87" y="329" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Unicode normalization</text><text x="87" y="354" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Sensitive-data patterns</text><text x="87" y="379" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Moss threat retrieval</text><path d="M310 345 H328 V345" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="265" width="245" height="160" rx="14" fill="#111d27" stroke="#30414d"/><text x="352" y="299" font-family="Arial, sans-serif" font-size="19" fill="#7de3c2" font-weight="600">02  Policy retrieval</text><text x="352" y="329" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Bundled MiniLM vectors</text><text x="352" y="354" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Moss native session</text><text x="352" y="379" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Top policy candidates</text><path d="M575 345 H593 V345" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="595" y="265" width="245" height="160" rx="14" fill="#111d27" stroke="#30414d"/><text x="617" y="299" font-family="Arial, sans-serif" font-size="19" fill="#7de3c2" font-weight="600">03  Source integrity</text><text x="617" y="329" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Versioned policy corpus</text><text x="617" y="354" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">SHA-256 source match</text><text x="617" y="379" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Quarantine altered text</text><path d="M840 345 H858 V345" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="265" width="245" height="160" rx="14" fill="#111d27" stroke="#30414d"/><text x="882" y="299" font-family="Arial, sans-serif" font-size="19" fill="#7de3c2" font-weight="600">04  Candidate answer</text><text x="882" y="329" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Groq / HiDevs backup</text><text x="882" y="354" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Trusted policy context</text><text x="882" y="379" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Never streamed to user</text><path d="M1105 345 H1123 V345" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="1125" y="265" width="245" height="160" rx="14" fill="#111d27" stroke="#30414d"/><text x="1147" y="299" font-family="Arial, sans-serif" font-size="19" fill="#7de3c2" font-weight="600">05  Release gate</text><text x="1147" y="329" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">PII scan + numeric check</text><text x="1147" y="354" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Moss source re-retrieval</text><text x="1147" y="379" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Withhold failed output</text><text x="80" y="475" font-family="Arial, sans-serif" font-size="14" fill="#ff9595" font-weight="600">BLOCK / DECLINE</text><text x="80" y="505" font-family="Arial, sans-serif" font-size="18" fill="#b4c4cf" font-weight="400">Any failed gate stops release. Outage is recorded as unavailable, never a successful answer.</text><text x="80" y="543" font-family="Arial, sans-serif" font-size="15" fill="#8395a4" font-weight="400">No financial tools. No account changes. No raw rejected candidate in traces.</text><rect x="65" y="620" width="410" height="190" rx="14" fill="#111d27" stroke="#30414d"/><text x="87" y="654" font-family="Arial, sans-serif" font-size="19" fill="#7de3c2" font-weight="600">Moss retrieval layer</text><text x="87" y="684" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Native custom sessions in-process</text><text x="87" y="709" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Same bundled encoder for docs + queries</text><text x="87" y="734" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">No model download on live requests</text><text x="87" y="759" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Embedding and search timed separately</text><rect x="515" y="620" width="410" height="190" rx="14" fill="#111d27" stroke="#30414d"/><text x="537" y="654" font-family="Arial, sans-serif" font-size="19" fill="#a1b8ff" font-weight="600">Evaluation + observability</text><text x="537" y="684" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">32 public regression cases</text><text x="537" y="709" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Attack blocking AND benign success</text><text x="537" y="734" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Live progress and per-case failures</text><text x="537" y="759" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">JSON exports + browser run comparison</text><rect x="965" y="620" width="405" height="190" rx="14" fill="#111d27" stroke="#30414d"/><text x="987" y="654" font-family="Arial, sans-serif" font-size="19" fill="#ecc681" font-weight="600">Privacy + failure isolation</text><text x="987" y="684" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Per-visitor HttpOnly session cookie</text><text x="987" y="709" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Redacted, temporary trace memory</text><text x="987" y="734" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Request-scoped outage simulations</text><text x="987" y="759" font-family="Arial, sans-serif" font-size="15" fill="#b4c4cf" font-weight="400">Rate limits and bounded calls</text><path d="M442 425 H442 V607" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 570 H720 V607" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><path d="M1230 425 H1230 V607" fill="none" stroke="#7de3c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="855" width="1305" height="110" rx="14" fill="#10231e" stroke="#345b4c"/><text x="87" y="893" font-family="Arial, sans-serif" font-size="14" fill="#7de3c2" font-weight="600">THE TRUST CONTRACT</text><text x="87" y="923" font-family="Arial, sans-serif" font-size="18" fill="#d9e8e2" font-weight="400">A released answer needs trusted context and passing output checks. A safe refusal is still a usefulness failure.</text><text x="65" y="1005" font-family="Arial, sans-serif" font-size="15" fill="#8395a4" font-weight="400">Similarity is a heuristic, not factual entailment. Single-tenant demonstration; memory is not durable storage.</text></svg>